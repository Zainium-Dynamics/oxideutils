[workspace]
resolver = "2"
members = [
    "crates/oxideutils-core",
    "crates/oxide-objdump",
    "crates/oxide-nm",
    "crates/oxide-readelf",
    "crates/oxide-strip",
    "crates/oxide-objcopy",
    "crates/oxide-ar",
    "crates/oxide-size",
    "crates/oxide-addr2line",
    "crates/oxide-strings",
    "crates/oxide-cxxfilt",
    "crates/oxide-elfedit",
]
default-members = [
    "crates/oxideutils-core",
    "crates/oxide-objdump",
    "crates/oxide-nm",
    "crates/oxide-readelf",
    "crates/oxide-size",
    "crates/oxide-strings",
    "crates/oxide-ar",
    "crates/oxide-strip",
    "crates/oxide-objcopy",
    "crates/oxide-addr2line",
    "crates/oxide-cxxfilt",
    "crates/oxide-elfedit",
    "crates/oxide-as",
    "crates/oxide-ld",
]

[workspace.package]
version = "0.1.0"
# Edition 2024 requires rustc ≥ 1.85 (MSRV). Prefer latest stable in practice.
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/zainium-dynamics/oxideutils"
homepage = "https://zainiumdynamics.tech"
authors = ["Zainium Dynamics <alizain@zainiumdynamics.tech>"]
rust-version = "1.85"
keywords = ["binutils", "elf", "objdump", "toolchain", "rust", "zainium"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[workspace.dependencies]
oxideutils-core = { path = "crates/oxideutils-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help", "color"] }
thiserror = "2"
object = { version = "0.36", default-features = false, features = [
    "read",
    "write",
    "std",
    "elf",
    "pe",
    "macho",
    "wasm",
    "archive",
    "compression",
    "unaligned",
] }
memmap2 = "0.9"
goblin = "0.9"
gimli = "0.31"
addr2line = "0.24"
capstone = "0.12"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "gas"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
byteorder = "1"
indexmap = "2"
once_cell = "1"
regex = "1"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
rustc-demangle = "0.1"
cpp_demangle = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1