[workspace]
resolver = "2"

members = [
    "crates/oxideutils-core",
    "crates/oxide-objdump",
    "crates/oxide-nm",
    "crates/oxide-readelf",
    "crates/oxide-strip",
    "crates/oxide-objcopy",
    "crates/oxide-ar",
    "crates/oxide-size",
    "crates/oxide-addr2line",
    "crates/oxide-strings",
    "crates/oxide-cxxfilt",
    "crates/oxide-elfedit",
    "crates/oxide-as",
    "crates/oxide-ld",
]

default-members = [
    "crates/oxideutils-core",
    "crates/oxide-objdump",
    "crates/oxide-nm",
    "crates/oxide-readelf",
    "crates/oxide-strip",
    "crates/oxide-objcopy",
    "crates/oxide-ar",
    "crates/oxide-size",
    "crates/oxide-addr2line",
    "crates/oxide-strings",
    "crates/oxide-cxxfilt",
    "crates/oxide-elfedit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

license = "GPL-3.0-only"

authors = ["Zainium Dynamics <alizain@zainiumdynamics.tech>"]

description = "oxideutils - A modern Rust implementation of the GNU Binutils toolchain."

homepage = "https://zainiumdynamics.tech"
repository = "https://gitlab.com/zainium-dynamics/oxideutils"

keywords = [
    "binutils",
    "elf",
    "linker",
    "assembler",
    "toolchain",
]

categories = [
    "command-line-utilities",
    "development-tools",
    "parser-implementations",
]

[workspace.dependencies]

oxideutils-core = { path = "crates/oxideutils-core", version = "0.1.0" }

clap = { version = "4.6", features = [
    "derive",
    "env",
    "wrap_help",
    "color",
] }

clap_complete = "4.6"
clap_mangen = "0.2"


anyhow = "1"
thiserror = "2"


object = { version = "0.36", default-features = false, features = [
    "read",
    "write",
    "std",
    "archive",
    "compression",
    "elf",
    "macho",
    "pe",
    "wasm",
    "unaligned",
] }

gimli = "0.31"
addr2line = "0.24"


memmap2 = "0.9"


iced-x86 = { version = "1.21", default-features = false, features = [
    "std",
    "decoder",
    "encoder",
    "gas",
] }

capstone = "0.12"


rustc-demangle = "0.1"
cpp_demangle = "0.4"


serde = { version = "1", features = ["derive"] }
serde_json = "1"


byteorder = "1"
indexmap = "2"
once_cell = "1"


tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


colored = "2"


[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"
nursery = "allow"
pedantic = "allow"


# Release Profile


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Dev Profile

[profile.dev]
opt-level = 1
debug = true
incremental = true


# Bench Profile
##################################################

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

##################################################
# Docs
##################################################

[profile.doc]
debug = false