image: rust:1.93

stages:
  - test
  - build
  - fuzz
  - bench
  - release

variables:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

before_script:
  # C toolchain + Clang/libclang + zstd for bindgen, fuzzing, and release archives.
  - apt-get update -qq && apt-get install -y -qq build-essential clang libclang-dev llvm binutils zstd > /dev/null
  - rustc --version && cargo --version
  - cargo fetch --locked || cargo fetch

test:
  stage: test
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --no-deps -- -D warnings
    - cargo test --workspace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  script:
    - rustup target add x86_64-unknown-none || true
    - bash scripts/build-all.sh
    - cargo build --workspace --release
    - cargo build -p oxideutils-core --release --no-default-features --features "alloc,disasm,kernel" --target-dir target-nostd
  artifacts:
    paths:
      - target/release/oxide-*
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Fuzzing Stage (cargo-fuzz integration)
fuzz:
  stage: fuzz
  script:
    # Nightly toolchain install for libFuzzer/sanitizer support
    - rustup toolchain install nightly --default
    - cargo +nightly install cargo-fuzz || true
    # Run fuzzing targets for a set duration per target (e.g., 60 seconds each in CI)
    - |
      if [ -d "fuzz" ]; then
        echo "=== Running Cargo Fuzz Targets ==="
        for target in $(cargo fuzz list); do
          echo "Fuzzing target: $target"
          cargo +nightly fuzz run "$target" -- -max_total_time=60 -runs=100000 || exit 1
        done
      else
        echo "No fuzz directory found, skipping fuzzing runner."
      fi
  artifacts:
    when: on_failure
    paths:
      - fuzz/artifacts/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

bench:
  stage: bench
  script:
    - cargo build --release -p oxide-objdump -p oxide-nm -p oxide-readelf
    - |
      BIN=/bin/ls
      echo "=== oxide-objdump -h ==="
      time ./target/release/oxide-objdump -h "$BIN" >/dev/null
      if command -v objdump >/dev/null; then
        echo "=== gnu objdump -h ==="
        time objdump -h "$BIN" >/dev/null
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release:
  stage: release
  script:
    - mkdir -p dist
    - VERSION="${CI_COMMIT_TAG#v}"
    - PACKAGE="oxideutile-${VERSION}"
    - git archive --format=tar --prefix="${PACKAGE}/" "$CI_COMMIT_SHA" | zstd -19 -T0 -o "dist/${PACKAGE}.tar.zst"
    - sha256sum "dist/${PACKAGE}.tar.zst" > "dist/${PACKAGE}.sha256"
    - echo "PACKAGE=${PACKAGE}" >> release.env
  artifacts:
    name: "oxideutile-$CI_COMMIT_TAG"
    paths:
      - dist/*
    expire_in: never
    reports:
      dotenv: release.env
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'oxideutile-$CI_COMMIT_TAG'
    description: |
      Automated workspace source release for $CI_COMMIT_TAG.

      - Built from commit: $CI_COMMIT_SHA
      - Artifact: dist/$PACKAGE.tar.zst
      - Checksum: dist/$PACKAGE.sha256
      - Archive excludes target/ because it is generated via git archive.
      - Changelog: CHANGELOG.md
    assets:
      links:
        - name: '$PACKAGE.tar.zst'
          url: '$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/$PACKAGE.tar.zst'
          filepath: '/$PACKAGE.tar.zst'
        - name: '$PACKAGE.sha256'
          url: '$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/$PACKAGE.sha256'
          filepath: '/$PACKAGE.sha256'
  rules:
    # Matches plain releases (v0.1.0) and pre-releases (v0.1.0-alpha, v0.1.0-rc.1, ...)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$/'
