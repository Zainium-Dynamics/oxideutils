image: rust:latest

stages:
  - test
  - build
  - fuzz
  - bench
  - release

variables:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

before_script:
  # C toolchain, LLVM dev tools, aur Clang (fuzzing and bindgen prerequisites)
  - apt-get update -qq && apt-get install -y -qq build-essential clang llvm binutils > /dev/null
  - rustc --version && cargo --version

test:
  stage: test
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --no-deps -- -D warnings
    - cargo test --workspace
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  script:
    - rustup target add x86_64-unknown-none || true
    - bash scripts/build-all.sh
    - cargo build --workspace --release
    - cargo build -p oxideutils-core --release --no-default-features --features "alloc,disasm,kernel" --target-dir target-nostd
  artifacts:
    paths:
      - target/release/oxide-*
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Fuzzing Stage (cargo-fuzz integration)
fuzz:
  stage: fuzz
  script:
    # Nightly toolchain install for libFuzzer/sanitizer support
    - rustup toolchain install nightly --default
    - cargo +nightly install cargo-fuzz || true
    # Run fuzzing targets for a set duration per target (e.g., 60 seconds each in CI)
    - |
      if [ -d "fuzz" ]; then
        echo "=== Running Cargo Fuzz Targets ==="
        for target in $(cargo fuzz list); do
          echo "Fuzzing target: $target"
          cargo +nightly fuzz run "$target" -- -max_total_time=60 -runs=100000 || exit 1
        done
      else
        echo "No fuzz directory found, skipping fuzzing runner."
      fi
  artifacts:
    when: on_failure
    paths:
      - fuzz/artifacts/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

bench:
  stage: bench
  script:
    - cargo build --release -p oxide-objdump -p oxide-nm -p oxide-readelf
    - |
      BIN=/bin/ls
      echo "=== oxide-objdump -h ==="
      time ./target/release/oxide-objdump -h "$BIN" >/dev/null
      if command -v objdump >/dev/null; then
        echo "=== gnu objdump -h ==="
        time objdump -h "$BIN" >/dev/null
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release:
  stage: release
  script:
    - cargo build --workspace --release
  artifacts:
    name: "oxideutils-$CI_COMMIT_TAG"
    paths:
      - target/release/oxide-objdump
      - target/release/oxide-nm
      - target/release/oxide-readelf
      - target/release/oxide-size
      - target/release/oxide-ar
      - target/release/oxide-strings
      - target/release/oxideutils
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'