name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MSRV policy: ≥ 1.85; CI uses latest stable (see rust-toolchain.toml)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Show rustc
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (std)
        run: cargo test --workspace
      - name: Unified build (std tools + no_std kernel core)
        run: bash scripts/build-all.sh
      - name: Release build (std)
        run: cargo build --workspace --release
      - name: Kernel no_std release
        run: |
          cargo build -p oxideutils-core --release \
            --no-default-features \
            --features "alloc,disasm,kernel" \
            --target-dir target-nostd
